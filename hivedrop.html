<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveDrop — Hive Micro-Post Composer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 30 30' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5' fill='%23FF6B35' opacity='0.2'/%3E%3Cpolygon points='15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5' stroke='%23FF6B35' stroke-width='1.5' fill='none'/%3E%3Ctext x='15' y='20' text-anchor='middle' font-family='serif' font-size='11' font-weight='800' fill='%23FF6B35'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --signal:      #FF6B35;
  --signal-dark: #E05520;
  --success:     #00D084;
  --warn:        #FFB800;
  --danger:      #FF4444;

  --bg:          #0E0F11;
  --surface:     #17191D;
  --surface-2:   #1E2026;
  --surface-3:   #24272F;
  --ink:         #F0F2F5;
  --ink-2:       #A0A6B4;
  --ink-3:       #6A707E;
  --border:      #2A2D34;
  --border-2:    #363B45;

  --snaps-color:   #FF6B35;
  --threads-color: #C98A00;
  --waves-color:   #00C4A0;
}

html, body { height: 100%; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px 48px;
}

/* ── Load animation ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
#app-header { animation: fadeUp 0.35s ease both; }
#composer   { animation: fadeUp 0.35s ease 0.07s both; }

/* ── Header ── */
#app-header {
  width: 100%;
  max-width: 560px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 0 20px;
}

#app-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
#app-logo svg { width: 26px; height: 26px; }

#logo-text {
  font-family: 'Syne', sans-serif;
  font-size: 21px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.5px;
}
#logo-text span { color: var(--signal); }

#header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

#keychain-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-3);
}

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--border-2);
  flex-shrink: 0;
  transition: background 0.3s;
}
.status-dot.ok  { background: var(--success); box-shadow: 0 0 5px rgba(0,208,132,0.5); }
.status-dot.err { background: var(--danger); }

#theme-toggle {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 9px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-3);
  transition: all 0.15s;
}
#theme-toggle:hover { border-color: var(--signal); color: var(--ink); }

/* ── Composer card ── */
#composer {
  width: 100%;
  max-width: 560px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: visible;
  box-shadow: 0 4px 32px rgba(0,0,0,0.5);
}

/* ── Platform bar ── */
#platform-bar {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 6px 6px 0 0;
}

#platform-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 10px;
}

#platform-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.platform-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px 6px 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-3);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.12s;
}
.platform-pill:hover { border-color: var(--border-2); color: var(--ink); }

.pill-accent {
  width: 7px; height: 7px;
  border-radius: 1px;
  flex-shrink: 0;
  opacity: 0.4;
  transition: opacity 0.12s;
}
.platform-pill[data-platform="snaps"]   .pill-accent { background: var(--snaps-color); }
.platform-pill[data-platform="threads"] .pill-accent { background: var(--threads-color); }
.platform-pill[data-platform="waves"]   .pill-accent { background: var(--waves-color); }

.platform-pill[data-platform="snaps"].selected   { border-color: var(--snaps-color);   color: var(--snaps-color); }
.platform-pill[data-platform="threads"].selected { border-color: var(--threads-color); color: var(--threads-color); }
.platform-pill[data-platform="waves"].selected   { border-color: var(--waves-color);   color: var(--waves-color); }
.platform-pill.selected .pill-accent { opacity: 1; }

/* ── Container status ── */
#container-status {
  margin-top: 9px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-3);
  min-height: 13px;
  display: flex;
  align-items: center;
  gap: 5px;
}
#container-status.ok  { color: var(--success); }
#container-status.err { color: var(--danger); }

.spin { display: inline-block; animation: spinning 0.7s linear infinite; }
@keyframes spinning { to { transform: rotate(360deg); } }

/* ── Formatting toolbar ── */
#fmt-toolbar {
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.fmt-btn {
  background: transparent;
  border: none;
  border-radius: 3px;
  padding: 5px 9px;
  cursor: pointer;
  color: var(--ink-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  transition: background 0.1s, color 0.1s;
  line-height: 1;
}
.fmt-btn:hover { background: var(--surface-3); color: var(--ink); }

.fmt-sep {
  width: 1px; height: 14px;
  background: var(--border);
  margin: 0 3px;
}

/* ── Emoji wrapper ── */
#emoji-wrapper {
  position: relative;
  margin-left: auto;
}

#emoji-btn {
  background: transparent;
  border: none;
  border-radius: 3px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  transition: background 0.1s;
}
#emoji-btn:hover { background: var(--surface-3); }

#emoji-picker {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  z-index: 200;
  width: 320px;
}
#emoji-picker.open { display: block; }

#emoji-categories {
  display: flex;
  gap: 3px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.emoji-cat-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  padding: 3px 6px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-3);
  transition: all 0.1s;
}
.emoji-cat-btn:hover,
.emoji-cat-btn.active {
  border-color: var(--border-2);
  color: var(--ink);
  background: var(--surface-3);
}

#emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 2px;
  max-height: 160px;
  overflow-y: auto;
}

.emoji-cell {
  background: transparent;
  border: none;
  border-radius: 3px;
  padding: 3px;
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
  text-align: center;
  transition: background 0.1s;
}
.emoji-cell:hover { background: var(--surface-3); }

/* ── Compose ── */
#compose-area {
  padding: 18px 18px 4px;
}

#post-body {
  width: 100%;
  min-height: 120px;
  max-height: 280px;
  border: none;
  outline: none;
  background: transparent;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  resize: none;
  overflow-y: auto;
}
#post-body::placeholder { color: var(--ink-3); }

/* ── Char bar ── */
#char-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 6px 18px 14px;
  gap: 7px;
}

#char-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-3);
  transition: color 0.2s;
}
#char-display.warn { color: var(--warn); }
#char-display.over { color: var(--danger); font-weight: 600; }

#clear-btn {
  margin-right: auto;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 9px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-3);
  transition: all 0.12s;
}
#clear-btn:hover { border-color: var(--danger); color: var(--danger); }

#char-arc { width: 18px; height: 18px; flex-shrink: 0; }

.divider { height: 1px; background: var(--border); }

/* ── TX info ── */
#tx-info {
  display: none;
  margin: 12px 14px 0;
  padding: 10px 12px;
  background: rgba(0,208,132,0.06);
  border: 1px solid rgba(0,208,132,0.2);
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--success);
  line-height: 1.7;
  position: relative;
}
#tx-info a { color: var(--signal); text-decoration: none; }
#tx-info a:hover { text-decoration: underline; }
#tx-close {
  position: absolute;
  top: 8px; right: 10px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--success);
  font-size: 14px;
  line-height: 1;
  opacity: 0.5;
  padding: 0;
}
#tx-close:hover { opacity: 1; }

/* ── Keychain notice ── */
#kc-notice {
  display: none;
  margin: 12px 14px 0;
  background: rgba(255,68,68,0.07);
  border: 1px solid rgba(255,68,68,0.2);
  border-radius: 4px;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #ff8070;
  line-height: 1.6;
}
#kc-notice a { color: var(--signal); }

/* ── Bottom row ── */
#bottom-row {
  padding: 12px 14px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

#username {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 11px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--surface-3);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
  min-width: 0;
}
#username::placeholder { color: var(--ink-3); }
#username:focus { border-color: var(--signal); }

#drop-btn {
  padding: 8px 20px;
  background: var(--signal);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.12s, transform 0.1s, opacity 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: 0.2px;
}
#drop-btn:hover:not(:disabled)  { background: var(--signal-dark); }
#drop-btn:active:not(:disabled) { transform: scale(0.97); }
#drop-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 5px;
  padding: 10px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink);
  box-shadow: 0 6px 28px rgba(0,0,0,0.6);
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
  z-index: 9999;
  max-width: 360px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.success { border-color: var(--success); color: var(--success); }
#toast.error   { border-color: var(--danger);  color: var(--danger); }

/* ── Light theme ── */
body.force-light {
  --bg:       #F4F5F7;
  --surface:  #FFFFFF;
  --surface-2:#F0F1F4;
  --surface-3:#E8EAEE;
  --ink:      #0E0F11;
  --ink-2:    #5A6070;
  --ink-3:    #9AA0AE;
  --border:   #D8DBE2;
  --border-2: #C4C8D2;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
</style>
</head>
<body>

<div id="app-header">
  <div id="app-logo">
    <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5" fill="#FF6B35" opacity="0.15"/>
      <polygon points="15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5" stroke="#FF6B35" stroke-width="1.5" fill="none"/>
      <text x="15" y="20" text-anchor="middle" font-family="'Syne',sans-serif" font-size="11" font-weight="800" fill="#FF6B35">H</text>
    </svg>
    <span id="logo-text">Hive<span>Drop</span></span>
  </div>
  <div id="header-controls">
    <div id="keychain-status">
      <div class="status-dot" id="kc-dot"></div>
      <span id="kc-label">checking…</span>
    </div>
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <span id="theme-icon">☀️</span> <span id="theme-label">Light</span>
    </button>
  </div>
</div>

<div id="composer">

  <div id="platform-bar">
    <div id="platform-label">Post to</div>
    <div id="platform-pills" role="group" aria-label="Select platform">
      <button class="platform-pill selected" data-platform="snaps" onclick="selectPlatform(this)" aria-pressed="true">
        <span class="pill-accent"></span>PeakD Snaps
      </button>
      <button class="platform-pill" data-platform="threads" onclick="selectPlatform(this)" aria-pressed="false">
        <span class="pill-accent"></span>InLeo Threads
      </button>
      <button class="platform-pill" data-platform="waves" onclick="selectPlatform(this)" aria-pressed="false">
        <span class="pill-accent"></span>Ecency Waves
      </button>
    </div>
    <div id="container-status"></div>
  </div>

  <div id="fmt-toolbar" role="toolbar" aria-label="Formatting">
    <button class="fmt-btn" onclick="fmtWrap('**','**')" title="Bold"><b>B</b></button>
    <button class="fmt-btn" onclick="fmtWrap('*','*')"   title="Italic"><i>I</i></button>
    <button class="fmt-btn" onclick="fmtWrap('~~','~~')" title="Strikethrough" style="text-decoration:line-through">S</button>
    <div class="fmt-sep"></div>
    <button class="fmt-btn" onclick="fmtLink()"  title="Link">🔗</button>
    <button class="fmt-btn" onclick="fmtImage()" title="Image">🖼</button>
    <div id="emoji-wrapper">
      <button class="fmt-btn" id="emoji-btn" onclick="toggleEmojiPicker()" title="Emoji" aria-expanded="false">😊</button>
      <div id="emoji-picker" role="dialog" aria-label="Emoji picker">
        <div id="emoji-categories"></div>
        <div id="emoji-grid"></div>
      </div>
    </div>
  </div>

  <div id="compose-area">
    <textarea
      id="post-body"
      placeholder="What's on your mind?"
      aria-label="Post body"
      spellcheck="true"
    ></textarea>
  </div>

  <div id="char-bar">
    <button id="clear-btn" onclick="clearBody()" title="Clear post">Clear</button>
    <svg id="char-arc" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="8" fill="none" stroke="var(--border-2)" stroke-width="2"/>
      <circle id="arc-fill" cx="10" cy="10" r="8" fill="none" stroke="#00D084"
        stroke-width="2" stroke-dasharray="50.27" stroke-dashoffset="50.27"
        stroke-linecap="round" transform="rotate(-90 10 10)"
        style="transition: stroke-dashoffset 0.2s, stroke 0.2s;"/>
    </svg>
    <span id="char-display">0 / 280</span>
  </div>

  <div class="divider"></div>

  <div id="kc-notice">
    Hive Keychain not detected.<br>
    <a href="https://chrome.google.com/webstore/detail/hive-keychain/jcacnejopjdphbnjgfaaobbfafkihpep" target="_blank" rel="noopener">Install for Chrome ↗</a> ·
    <a href="https://addons.mozilla.org/en-US/firefox/addon/hive-keychain/" target="_blank" rel="noopener">Firefox ↗</a>
  </div>

  <div id="tx-info">
    <button id="tx-close" onclick="closeTxInfo()" aria-label="Dismiss">×</button>
    <div>✓ Posted</div>
    <div style="margin-top:2px;">Tx: <span id="tx-id"></span></div>
    <div><a id="tx-link" href="#" target="_blank" rel="noopener">View on Hive Explorer ↗</a></div>
  </div>

  <div id="bottom-row">
    <input id="username" placeholder="@yourusername" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Hive username">
    <button id="drop-btn" onclick="drop()" disabled aria-label="Post to Hive">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      Drop it
    </button>
  </div>

</div>

<div id="toast" role="alert" aria-live="assertive"></div>

<script>
(function() {

  const PLATFORMS = {
    snaps: {
      label: 'PeakD Snaps', containerAcct: 'peak.snaps',
      community: 'hive-124838', defaultTag: 'snaps',
      app: 'peakd/2026.6.6', charLimit: 280,
      buildMeta: function(tags) {
        return JSON.stringify({ app: this.app, tags: tags, image: [] });
      },
      buildTitle: function() { return ''; },
      needsCommentOptions: false
    },
    threads: {
      label: 'InLeo Threads', containerAcct: 'leothreads',
      community: 'hive-167922', defaultTag: 'leofinance',
      app: 'leothreads/0.3', charLimit: 130,
      buildMeta: function(tags, author, permlink) {
        return JSON.stringify({
          app: this.app, format: 'markdown', tags: tags,
          canonical_url: 'https://inleo.io/threads/view/' + author + '/' + permlink,
          isPoll: false, pollOptions: {}, dimensions: {}
        });
      },
      buildTitle: function(author, body) {
        let p = body.substring(0, 50).replace(/"/g, '\u201c').trim();
        return '@' + author + ' \u201c' + p + (body.length > 50 ? '\u2026' : '') + '\u201d';
      },
      needsCommentOptions: true
    },
    waves: {
      label: 'Ecency Waves', containerAcct: 'ecency.waves',
      community: 'hive-125125', defaultTag: 'ecency',
      app: 'ecency/4.4.0-vision', charLimit: 250,
      buildMeta: function(tags) {
        return JSON.stringify({ app: this.app, tags: tags, format: 'markdown+html' });
      },
      buildTitle: function() { return ''; },
      needsCommentOptions: false
    }
  };

  let currentPlatform   = 'snaps';
  let containerPermlink = null;
  let containerFetching = false;
  let toastQueue = []; let toastActive = false; let toastTimer = null;
  let themeMode  = 'dark';
  let emojiOpen  = false;

  /* Restore saved username */
  (function() {
    let saved = localStorage.getItem('hivedrop_username');
    if (saved) document.getElementById('username').value = saved;
  })();

  /* Save username on change */
  document.getElementById('username').addEventListener('input', function() {
    let val = this.value.trim().replace(/^@/, '');
    if (val) localStorage.setItem('hivedrop_username', val);
    else localStorage.removeItem('hivedrop_username');
  });
  function sanitizeUrl(url) {
    let d; try { d = decodeURIComponent(url.trim()); } catch(e) { d = url.trim(); }
    if (/^(https?:|ipfs:|hive:)/i.test(d)) return escAttr(d);
    return '#blocked';
  }
  function escAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;')
            .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* Theme */
  function toggleTheme() {
    let body = document.body;
    if (themeMode === 'dark') {
      themeMode = 'light';
      body.classList.add('force-light');
      document.getElementById('theme-icon').textContent  = '🌙';
      document.getElementById('theme-label').textContent = 'Dark';
    } else {
      themeMode = 'dark';
      body.classList.remove('force-light');
      document.getElementById('theme-icon').textContent  = '☀️';
      document.getElementById('theme-label').textContent = 'Light';
    }
  }

  /* Keychain */
  function checkKeychain() {
    let dot = document.getElementById('kc-dot');
    let lbl = document.getElementById('kc-label');
    let btn = document.getElementById('drop-btn');
    let ntc = document.getElementById('kc-notice');
    if (typeof window.hive_keychain !== 'undefined') {
      dot.className = 'status-dot ok'; lbl.textContent = 'Keychain connected';
      btn.disabled = false; ntc.style.display = 'none';
    } else {
      dot.className = 'status-dot err'; lbl.textContent = 'Keychain not found';
      btn.disabled = true; ntc.style.display = 'block';
    }
  }
  setTimeout(checkKeychain, 500);
  setTimeout(checkKeychain, 1500);
  setTimeout(checkKeychain, 3000);

  /* Platform select */
  function selectPlatform(el) {
    document.querySelectorAll('.platform-pill').forEach(function(b) {
      b.classList.remove('selected'); b.setAttribute('aria-pressed','false');
    });
    el.classList.add('selected'); el.setAttribute('aria-pressed','true');
    currentPlatform = el.getAttribute('data-platform');
    containerPermlink = null;
    updateCharCounter(document.getElementById('post-body').value.length);
    fetchContainer();
  }

  /* Container fetch */
  function fetchContainer() {
    let p  = PLATFORMS[currentPlatform];
    let st = document.getElementById('container-status');
    st.className = ''; st.innerHTML = '<span class="spin">⟳</span> Fetching container…';
    containerPermlink = null; containerFetching = true;

    fetch('https://api.hive.blog', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc:'2.0', method:'condenser_api.get_discussions_by_blog',
        params:[{ tag: p.containerAcct, limit: 1 }], id: 1 })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      containerFetching = false;
      if (data.result && data.result.length > 0) {
        containerPermlink = data.result[0].permlink;
        st.className = 'ok';
        st.innerHTML = '✓ Ready to post · ' + escAttr(containerPermlink);
      } else {
        st.className = 'err'; st.innerHTML = '✗ No active container';
      }
    })
    .catch(function(err) {
      containerFetching = false;
      st.className = 'err'; st.innerHTML = '✗ Oops, false start — check connection and try again';
      console.error('[HiveDrop] Container fetch:', err);
    });
  }
  fetchContainer();

  /* Char counter */
  document.getElementById('post-body').addEventListener('input', function() {
    updateCharCounter(this.value.length);
  });

  function updateCharCounter(len) {
    let limit = PLATFORMS[currentPlatform].charLimit;
    let disp  = document.getElementById('char-display');
    let arc   = document.getElementById('arc-fill');
    let pct   = Math.min(len / limit, 1);
    arc.style.strokeDashoffset = 50.27 - (50.27 * pct);
    disp.textContent = len + ' / ' + limit;
    if (len > limit)            { disp.className = 'over'; arc.style.stroke = '#FF4444'; }
    else if (len > limit * 0.85){ disp.className = 'warn'; arc.style.stroke = '#FFB800'; }
    else                        { disp.className = '';     arc.style.stroke = '#00D084'; }
  }

  /* Formatting */
  function getTA() { return document.getElementById('post-body'); }

  function fmtWrap(pre, post) {
    let ta = getTA(), s = ta.selectionStart, e = ta.selectionEnd;
    let sel = ta.value.substring(s, e) || 'text';
    ta.value = ta.value.substring(0,s) + pre + sel + post + ta.value.substring(e);
    ta.focus(); ta.selectionStart = s + pre.length; ta.selectionEnd = s + pre.length + sel.length;
    updateCharCounter(ta.value.length);
  }

  function fmtLink() {
    let url = prompt('URL:'); if (!url) return;
    let ta  = getTA(), s = ta.selectionStart, e = ta.selectionEnd;
    let sel = ta.value.substring(s, e).trim();
    let linkText = sel || prompt('Link text:') || url;
    let ins = '[' + linkText + '](' + url + ')';
    ta.value = ta.value.substring(0, s) + ins + ta.value.substring(e);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = s + ins.length;
    updateCharCounter(ta.value.length);
  }

  function fmtImage() {
    let url = prompt('Image URL:'); if (!url) return;
    let alt = prompt('Alt text (optional):') || '';
    let ta = getTA(), pos = ta.selectionStart;
    let ins = '![' + alt + '](' + url + ')';
    ta.value = ta.value.substring(0,pos) + ins + ta.value.substring(pos);
    ta.focus(); updateCharCounter(ta.value.length);
  }

  ];

  function buildEmojiPicker() {
    let catEl = document.getElementById('emoji-categories');
    EMOJI_CATS.forEach(function(cat, i) {
      let btn = document.createElement('button');
      btn.className = 'emoji-cat-btn' + (i === 0 ? ' active' : '');
      btn.textContent = cat.label;
      btn.onclick = function() {
        document.querySelectorAll('.emoji-cat-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderEmojiGrid(i);
      };
      catEl.appendChild(btn);
    });
    renderEmojiGrid(0);
  }

  function renderEmojiGrid(idx) {
    let grid = document.getElementById('emoji-grid');
    grid.innerHTML = '';
    EMOJI_CATS[idx].emojis.forEach(function(emoji) {
      let btn = document.createElement('button');
      btn.className = 'emoji-cell'; btn.textContent = emoji; btn.title = emoji;
      btn.onclick = function() { insertEmoji(emoji); };
      grid.appendChild(btn);
    });
  }

  function toggleEmojiPicker() {
    emojiOpen = !emojiOpen;
    document.getElementById('emoji-picker').classList.toggle('open', emojiOpen);
    document.getElementById('emoji-btn').setAttribute('aria-expanded', emojiOpen);
  }

  function insertEmoji(emoji) {
    let ta = getTA(), pos = ta.selectionStart;
    ta.value = ta.value.substring(0,pos) + emoji + ta.value.substring(pos);
    ta.focus(); ta.selectionStart = ta.selectionEnd = pos + emoji.length;
    updateCharCounter(ta.value.length);
    emojiOpen = false;
    document.getElementById('emoji-picker').classList.remove('open');
    document.getElementById('emoji-btn').setAttribute('aria-expanded','false');
  }

  document.addEventListener('click', function(e) {
    if (emojiOpen && !document.getElementById('emoji-wrapper').contains(e.target)) {
      emojiOpen = false;
      document.getElementById('emoji-picker').classList.remove('open');
      document.getElementById('emoji-btn').setAttribute('aria-expanded','false');
    }
  });

  buildEmojiPicker();

  /* TX dismiss */
  function closeTxInfo() {
    document.getElementById('tx-info').style.display = 'none';
  }

  /* Toast */
  function toast(msg, type) {
    toastQueue.push({ msg: msg, type: type || '' });
    if (!toastActive) processToastQueue();
  }
  function processToastQueue() {
    if (toastQueue.length === 0) { toastActive = false; return; }
    toastActive = true;
    let item = toastQueue.shift();
    let t = document.getElementById('toast');
    t.textContent = item.msg; t.className = 'show ' + item.type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      t.className = '';
      setTimeout(processToastQueue, 350);
    }, 3500);
  }

  /* Permlink */
  function makePermlink(platform) {
    if (platform === 'snaps')   return 're-peaksnaps-'  + Date.now().toString(36);
    if (platform === 'threads') return 're-leothreads-' + Date.now().toString(36);
    if (platform === 'waves')   return 'wave-' + new Date().toISOString().replace(/[-:T.Z]/g,'').substring(0,14) + Date.now().toString(36).slice(-4);
    return 'drop-' + Date.now().toString(36);
  }

  /* Drop */
  function drop() {
    checkKeychain();
    let username = document.getElementById('username').value.trim().replace(/^@/,'');
    let body     = document.getElementById('post-body').value.trim();
    let platform = PLATFORMS[currentPlatform];

    if (!username)                        { toast('Enter your Hive username', 'error'); return; }
    if (!body)                            { toast('Write something first', 'error'); return; }
    if (body.length > platform.charLimit) { toast('Too long for ' + platform.label + ' (' + body.length + '/' + platform.charLimit + ')', 'error'); return; }
    if (typeof window.hive_keychain === 'undefined') { toast('Hive Keychain not found', 'error'); return; }
    if (!containerPermlink) {
      toast(containerFetching ? 'Container loading — try again shortly' : 'No container found — retrying…', 'error');
      if (!containerFetching) fetchContainer();
      return;
    }

    let permlink = makePermlink(currentPlatform);
    let tags     = [platform.defaultTag];
    let title    = platform.buildTitle(username, body);
    let meta     = platform.buildMeta(tags, username, permlink);

    let ops = [['comment', {
      parent_author: platform.containerAcct, parent_permlink: containerPermlink,
      author: username, permlink: permlink, title: title, body: body, json_metadata: meta
    }]];

    if (platform.needsCommentOptions) {
      ops.push(['comment_options', {
        author: username, permlink: permlink,
        max_accepted_payout: '1000000.000 HBD', percent_hbd: 10000,
        allow_votes: true, allow_curation_rewards: true, extensions: []
      }]);
    }

    let btn = document.getElementById('drop-btn');
    btn.disabled  = true;
    btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Signing…';

    let timeout = setTimeout(function() {
      btn.disabled = false; btn.innerHTML = dropBtnHTML();
      toast('Request timed out — try again', 'error');
    }, 35000);

    window.hive_keychain.requestBroadcast(username, ops, 'posting', function(response) {
      clearTimeout(timeout);
      btn.disabled = false; btn.innerHTML = dropBtnHTML();
      if (response.success) {
        let txId = (response.result && response.result.id) ? response.result.id : '';
        let ti = document.getElementById('tx-info');
        if (txId) {
          document.getElementById('tx-id').textContent = txId.substring(0,20) + '…';
          document.getElementById('tx-link').href = 'https://hive.ausbit.dev/tx/' + txId;
        }
        ti.style.display = 'block';
        toast('✓ Dropped! @' + username + '/' + permlink, 'success');
        fetchContainer();
      } else {
        let err = response.message || response.error || 'Transaction rejected';
        toast('Error: ' + err, 'error');
        console.error('[HiveDrop] Broadcast error:', response);
      }
    });
  }

  function clearBody() {
    document.getElementById('post-body').value = '';
    updateCharCounter(0);
    document.getElementById('post-body').focus();
  }

  function dropBtnHTML() {
    return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Drop it';
  }

  window.toggleTheme      = toggleTheme;
  window.selectPlatform   = selectPlatform;
  window.drop             = drop;
  window.fmtWrap          = fmtWrap;
  window.fmtLink          = fmtLink;
  window.fmtImage         = fmtImage;
  window.toggleEmojiPicker = toggleEmojiPicker;
  window.closeTxInfo      = closeTxInfo;
  window.clearBody        = clearBody;

})();
</script>
